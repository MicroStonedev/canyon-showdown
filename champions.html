<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>英雄卡通建模设计图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #14171f; font-family: "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 20px; }
  h1 { color: #4caf50; font-size: 24px; margin-bottom: 4px; letter-spacing: 3px; }
  .sub { color: #9aa3b5; font-size: 13px; margin-bottom: 14px; }
  canvas { border-radius: 12px; }
  .headRow { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
  .backBtn { display: inline-flex; align-items: center; gap: 7px; text-decoration: none;
    background: #232936; color: #9fc4ff; border: 2px solid #333a4a; border-radius: 10px;
    padding: 8px 18px; font-size: 14px; transition: all .15s ease; }
  .backBtn:hover { border-color: #3f8cff; color: #cfe2ff; transform: translateX(-2px); }
  .langRow { display: flex; gap: 10px; margin-bottom: 16px; }
  .langBtn { background: #232936; color: #9aa3b5; border: 2px solid #333a4a; border-radius: 10px;
    padding: 7px 22px; font-size: 14px; cursor: pointer; transition: all .15s; font-family: inherit; }
  .langBtn:hover { border-color: #4caf5088; }
  .langBtn.sel { border-color: #4caf50; color: #7ee08a; background: #213028; }
</style>
</head>
<body>
<div class="headRow">
  <a class="backBtn" id="backBtn" href="index.html">← 返回初始页面</a>
  <div style="flex:1"></div>
  <div class="langRow" style="margin-bottom:0">
    <button class="langBtn sel" id="langCn">🇨🇳 中文</button>
    <button class="langBtn" id="langEn">🇺🇸 English</button>
  </div>
</div>
<h1 id="pgTitle">英雄卡通建模设计图</h1>
<div class="sub" id="pgSub">Canyon Duel 角色概念稿 · 参照英雄联盟原设特征 · Canvas 矢量绘制</div>
<canvas id="sheet" width="1280" height="620"></canvas>
<script src="heroes.js"></script>
<script>
'use strict';
// 设计图直接复用游戏内的英雄模型（heroes.js），保证图纸和实际角色完全一致
const cv = document.getElementById('sheet'), g = cv.getContext('2d');
const SHEET = [
  { role: 'marksman', name: '韦鲁斯', en: 'Varus',     sub: '射手 · 暗裔神射 · 长弓',      enSub: 'Marksman · Darkin · longbow',       col: '#b76ce9' },
  { role: 'assassin',  name: '亚索',   en: 'Yasuo',     sub: '刺客 · 疾风剑豪 · 武士刀',    enSub: 'Assassin · wind swordsman · katana', col: '#a8e4ff' },
  { role: 'support',   name: '萨勒芬妮', en: 'Seraphine', sub: '辅助 · 星籁歌姬 · 麦克风',  enSub: 'Support · songstress · microphone',  col: '#ff9ec4' },
  { role: 'tank',      name: '布隆',   en: 'Braum',     sub: '坦克 · 冰霜守卫 · 巨门盾',    enSub: 'Tank · frost guardian · door shield', col: '#4a7fd4' },
];
// 中英文案
const TXT = {
  cn: {
    title: '英雄卡通建模设计图',
    sub: 'Canyon Duel 角色概念稿 · 参照英雄联盟原设特征 · Canvas 矢量绘制',
    skill: (sk) => '【' + sk.name + '】 CD ' + sk.cd + 's',
    desc: (sk) => sk.desc,
    caps: ['普攻 · 3级技能【穿云箭】', '普攻近战 · 3级技能【影袭】',
      '普攻治疗友军 · 技能【圣光波】', '普攻整圆范围 · 技能【震地】'],
  },
  en: {
    title: 'Champion Design Sheet',
    sub: 'Canyon Duel character concept art · inspired by League of Legends archetypes · drawn with Canvas',
    skill: (sk) => '[' + sk.en + '] CD ' + sk.cd + 's',
    desc: (sk) => sk.dEn,
    caps: ['Basic attack · Lv3 skill [Piercing Arrow]', 'Melee basic attack · Lv3 skill [Shadow Dash]',
      'Basics heal allies · skill [Light Wave]', '360° melee basics · skill [Seismic Slam]'],
  },
};
let LANG = 'cn';
const T = () => TXT[LANG];
// 英文描述按词断行（中文按字数），最多三行
function wrap(text, per) {
  const out = []; let line = '';
  text.split(/(?=[ ,])|\s+/).forEach(w => {   // 英文：按空格/标点切
    line += w;
    if (line.length >= per) { out.push(line.trim()); line = ''; }
  });
  if (line.trim()) out.push(line.trim());
  return out;
}
const PW = 290, PH = 580, TOP = 20;             // 面板尺寸
// 缩放与横向微调：按各英雄在完整攻击周期里的最坏外框标定（保证挥刀/举弓不溢出面板）
// 刺客挥刀时外框最宽（6.5 倍下 293px 超出面板），故单独用 5.9
const K = { marksman: 6.5, assassin: 5.9, support: 6.5, tank: 6.5 };
const OX = { marksman: -39, assassin: -10, support: -26, tank: -29 };

/* ---- 静态层：面板、标题、技能说明（只画一次，缓存到离屏画布） ---- */
const bg = document.createElement('canvas'); bg.width = 1280; bg.height = 620;
const bgx = bg.getContext('2d');
function drawStatic(t) {
  t.fillStyle = '#14171f'; t.fillRect(0, 0, 1280, 620);
  SHEET.forEach((s, i) => {
    const x = 15 + i * 315, cx = x + PW / 2;
    t.fillStyle = '#1e2330'; t.beginPath(); t.roundRect(x, TOP, PW, PH, 16); t.fill();
    t.strokeStyle = s.col; t.lineWidth = 2; t.beginPath(); t.roundRect(x, TOP, PW, PH, 16); t.stroke();
    const gr = t.createRadialGradient(cx, 330, 20, cx, 330, 170);
    gr.addColorStop(0, s.col + '33'); gr.addColorStop(1, '#1e233000');
    t.fillStyle = gr; t.fillRect(x + 10, 150, PW - 20, 360);
    t.textAlign = 'center';
    t.fillStyle = s.col; t.font = 'bold 22px "Microsoft YaHei"';
    t.fillText(LANG === 'cn' ? s.name : s.en, cx, 62);
    t.fillStyle = '#9aa3b5'; t.font = '13px "Microsoft YaHei"';
    t.fillText(LANG === 'cn' ? s.sub : s.enSub, cx, 86);
    // 技能说明（数值取自游戏内 ROLES，图纸与实际同步）
    const sk = ROLES[s.role].skill;
    t.fillStyle = '#ffd54f'; t.font = 'bold 14px "Microsoft YaHei"';
    t.fillText(T().skill(sk), cx, 128);
    t.fillStyle = '#8a93aa'; t.font = '12px "Microsoft YaHei"';
    const lines = LANG === 'cn' ? wrap(T().desc(sk), 15) : wrap(T().desc(sk), 34);
    lines.slice(0, 3).forEach((l, j) => t.fillText(l, cx, 152 + j * 18));
  });
  // 底部说明
  t.fillStyle = '#9aa3b5'; t.font = '12px "Microsoft YaHei"'; t.textAlign = 'center';
  SHEET.forEach((s, i) => t.fillText(T().caps[i], 15 + i * 315 + PW / 2, 578));
}
function applyLang() {
  document.getElementById('pgTitle').textContent = T().title;
  document.getElementById('backBtn').textContent = LANG === 'cn' ? '← 返回初始页面' : '← Back to main page';
  document.getElementById('pgSub').textContent = T().sub;
  document.getElementById('langCn').classList.toggle('sel', LANG === 'cn');
  document.getElementById('langEn').classList.toggle('sel', LANG === 'en');
  drawStatic(bgx);                                       // 重绘静态层（面板文字随语言切换）
}
document.getElementById('langCn').onclick = () => { LANG = 'cn'; applyLang(); };
document.getElementById('langEn').onclick = () => { LANG = 'en'; applyLang(); };
applyLang();

/* ---- 动态层：四个英雄模型（与游戏内同一份代码） ---- */
const mocks = {};
SHEET.forEach(s => {
  mocks[s.role] = { role: s.role, team: 0, vx: 0, vy: 0, vaim: -0.35, aim: -0.35, walkPhase: 0,
    atkCdT: ROLES[s.role].atkCd * 0.82,            // 停在拉弦/挥击前摇，展示武器姿态
    skillAnimT: 0, stealthT: 0, shield: 0, speedT: 0, sprintT: 0, slowT: 0,
    isPlayer: false, lastCombat: 0, bowRaise: 1, lvl: 5, hp: 1, maxHp: 1, dead: false };
});
function drawModel(role, alpha, t) {
  const c = mocks[role];
  if (role === 'marksman') drawMarksmanModel(c, alpha, t);
  else if (role === 'assassin') drawAssassinModel(c, alpha, t);
  else if (role === 'tank') drawTankModel(c, alpha, t);
  else drawSupportModel(c, alpha, t);
}
function drawHeroes() {
  SHEET.forEach((s, i) => {
    const cx = 15 + i * 315 + PW / 2 + OX[s.role], by = 512;   // 上移：脚下队伍环不再压到底部说明文字
    g.save();
    g.translate(cx, by); g.scale(K[s.role], K[s.role]);
    g.lineCap = 'round'; g.lineJoin = 'round';
    // 地面投影（与游戏内一致）
    g.fillStyle = 'rgba(15,25,18,0.28)';
    g.beginPath(); g.ellipse(0, 2, 11 * (ROLES[s.role].r / 15), 4.5 * (ROLES[s.role].r / 15), 0, 0, 7); g.fill();
    drawModel(s.role, 1, g);
    g.restore();
  });
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  gameTime += dt;                                    // 推进模型待机动画（呼吸/摆动）
  g.drawImage(bg, 0, 0);
  drawHeroes();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
