<!DOCTYPE html>

<title>峡谷对决 Canyon Showdown - 5v5 MOBA</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(1200px 600px at 50% -10%, #1c2436 0%, #14171f 55%);
    color: #e0e0e0;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    text-align: center;
    padding: 40px 20px;
  }
  h1 {
    font-size: clamp(38px, 7vw, 64px);
    letter-spacing: 8px;
    color: #fff;
    text-shadow: 0 0 24px rgba(76,175,80,.45), 0 2px 0 rgba(0,0,0,.4);
  }
  .en {
    margin-top: 6px;
    font-size: clamp(14px, 2.2vw, 18px);
    letter-spacing: 6px;
    color: #8a93aa;
    text-transform: uppercase;
  }
  .tagline { margin-top: 18px; color: #9aa3b5; font-size: 15px; }
  .roles { margin-top: 10px; font-size: 15px; color: #c7ceda; letter-spacing: 2px; }
  .btn {
    margin-top: 40px;
    display: inline-block;
    padding: 16px 58px;
    font-size: 20px; font-weight: bold; letter-spacing: 4px;
    color: #fff; text-decoration: none;
    background: linear-gradient(135deg, #4caf50, #2e7d32);
    border: 1px solid #66bb6a;
    border-radius: 12px;
    box-shadow: 0 6px 24px rgba(76,175,80,.35);
    transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(76,175,80,.5); filter: brightness(1.08); }
  .card {
    margin-top: 22px;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 28px;
    color: #9fc4ff; text-decoration: none; font-size: 15px;
    background: #1a1d24; border: 1px solid #333a4a; border-radius: 10px;
    transition: border-color .15s ease, color .15s ease, transform .15s ease;
  }
  .card:hover { border-color: #3f8cff; color: #cfe2ff; transform: translateY(-1px); }
  footer { margin-top: 60px; font-size: 13px; color: #6b7386; }
  footer a { color: #8a93aa; text-decoration: none; border-bottom: 1px dotted #4a5266; }
  footer a:hover { color: #c3cad8; }
  .divider { margin: 0 10px; color: #3a4152; }
</style>
</head>
