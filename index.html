<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>峡谷对决 Canyon Showdown - 5v5 MOBA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314171f'/%3E%3Cpath d='M16 5l8 9-8 13-8-13z' fill='%234caf50'/%3E%3Cpath d='M16 5l8 9-8 4z' fill='%237ee08a'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #0a0e16;
    color: #e0e0e0;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    text-align: center;
    padding: 40px 20px 120px;                 /* 下方留白给峡谷地平线 */
    position: relative; overflow-x: hidden;
  }
  /* ===== ① 峡谷场景背景 ===== */
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
  .wrap, footer { position: relative; z-index: 1; }

  .wrap {
    width: 100%; max-width: 1180px;
    display: grid; grid-template-columns: 1.05fr .95fr; gap: 48px; align-items: center;
    text-align: left;
  }
  /* ===== 标题 ===== */
  h1 {
    font-size: clamp(40px, 6.4vw, 68px);
    letter-spacing: 8px; line-height: 1.05;
    background: linear-gradient(180deg, #ffffff 20%, #b9f6ca 90%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 22px rgba(76,175,80,.35));
    animation: titleGlow 3.6s ease-in-out infinite;
  }
  @keyframes titleGlow {
    0%, 100% { filter: drop-shadow(0 0 16px rgba(76,175,80,.22)); }
    50%      { filter: drop-shadow(0 0 30px rgba(76,175,80,.45)); }
  }
  .en {
    margin-top: 10px; font-size: clamp(13px, 1.8vw, 17px);
    letter-spacing: 9px; color: #8a93aa; text-transform: uppercase;
  }
  .tagline { margin-top: 20px; color: #9aa3b5; font-size: 15px; line-height: 1.7; max-width: 34em; }

  /* ===== ④ 职业徽章（替换裸 emoji） ===== */
  .roles { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 14px; border-radius: 999px; font-size: 14px; letter-spacing: 1px;
    background: #141a26cc; border: 1px solid #2c3444; color: #c7ceda;
    backdrop-filter: blur(2px);
  }
  .chip i { font-style: normal; font-size: 15px; }
  .chip.c-m { border-color: #2b6b7a88; color: #9fe6f2; }   /* 射手 青 */
  .chip.c-a { border-color: #4a5568;    color: #cfd6e4; }   /* 刺客 钢 */
  .chip.c-t { border-color: #8a5a1f88; color: #ffcc80; }   /* 肉盾 橙 */
  .chip.c-s { border-color: #a05a8a88; color: #f4b8d8; }   /* 辅助 粉 */

  /* ===== 按钮 ===== */
  .btn {
    margin-top: 34px;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 17px 62px;
    font-size: 20px; font-weight: bold; letter-spacing: 4px;
    color: #fff; text-decoration: none;
    background: linear-gradient(135deg, #4caf50, #2e7d32);
    border: 1px solid #66bb6a; border-radius: 14px;
    box-shadow: 0 6px 24px rgba(76,175,80,.35), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    animation: btnBreathe 2.8s ease-in-out infinite;
  }
  @keyframes btnBreathe {
    0%, 100% { box-shadow: 0 6px 22px rgba(76,175,80,.28), inset 0 1px 0 rgba(255,255,255,.25); }
    50%      { box-shadow: 0 8px 34px rgba(76,175,80,.55), inset 0 1px 0 rgba(255,255,255,.25); }
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.08);
    box-shadow: 0 12px 34px rgba(76,175,80,.5), inset 0 1px 0 rgba(255,255,255,.25); }
  .btn:active { transform: translateY(0) scale(.985); }

  .card {
    margin-top: 20px; margin-left: 2px;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 26px;
    color: #9fc4ff; text-decoration: none; font-size: 15px;
    background: #141a26cc; border: 1px solid #333a4a; border-radius: 12px;
    transition: border-color .15s ease, color .15s ease, transform .15s ease, background .15s ease;
  }
  .card:hover { border-color: #3f8cff; color: #cfe2ff; transform: translateY(-1px); background: #18202ee6; }

  /* ===== ③ 英雄展示台 ===== */
  .stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #hero { width: 260px; height: 300px; display: block; }
  .heroName { text-align: center; }
  .heroName b { display: block; font-size: 19px; letter-spacing: 3px; color: #e8eef7; }
  .heroName span { display: block; margin-top: 3px; font-size: 12px; letter-spacing: 3px;
    text-transform: uppercase; color: #7a8194; }
  .dots { display: flex; gap: 8px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: #2c3444; transition: all .25s ease; }
  .dots i.on { background: #4caf50; box-shadow: 0 0 10px #4caf5099; transform: scale(1.25); }

  /* ===== ④ 页脚 ===== */
  footer { margin-top: 54px; font-size: 13px; color: #6b7386;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; }
  footer a { color: #8a93aa; text-decoration: none; border-bottom: 1px dotted #4a5266; }
  footer a:hover { color: #c3cad8; }
  .divider { margin: 0 4px; color: #3a4152; }
  .tech { padding: 3px 11px; font-size: 12px; letter-spacing: 1px; color: #7f8899;
    background: #141a2699; border-color: #262d3b; }

  @media (max-width: 900px) {
    .wrap { grid-template-columns: 1fr; gap: 28px; text-align: center; }
    .roles, .tagline { justify-content: center; margin-left: auto; margin-right: auto; }
    .card { margin-left: 0; }
    #hero { width: 210px; height: 245px; }
    body { padding-bottom: 90px; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<main class="wrap">
  <section>
    <h1>峡谷对决</h1>
    <div class="en">Canyon Showdown</div>
    <p class="tagline">网页 5v5 MOBA 推塔对战 · 5v5 web MOBA</p>
    <div class="roles">
      <span class="chip c-m"><i>🏹</i>射手</span>
      <span class="chip c-a"><i>🗡️</i>刺客</span>
      <span class="chip c-t"><i>🛡️</i>肉盾</span>
      <span class="chip c-s"><i>✚</i>辅助</span>
    </div>
    <a class="btn" href="moba.html">▶ 开始游戏 / PLAY</a>
    <br>
    <a class="card" href="champions.html">🎨 英雄设计图 / Champion Design Sheet</a>
  </section>

  <aside class="stage">
    <canvas id="hero"></canvas>
    <div class="heroName"><b id="heroCn">射手</b><span id="heroEn">Marksman</span></div>
    <div class="dots" id="dots"><i class="on"></i><i></i><i></i><i></i></div>
  </aside>
</main>

<footer>
  <span class="chip tech">HTML5</span>
  <span class="chip tech">Canvas 2D</span>
  <span class="chip tech">零依赖 / Zero deps</span>
  <a href="https://github.com/MicroStonedev/canyon-showdown">GitHub</a><span class="divider">·</span>MIT License
</footer>

<script src="heroes.js"></script>
<script>
'use strict';
/* ================= 画布与尺寸 ================= */
const dpr = Math.min(2, window.devicePixelRatio || 1);
const scene = document.getElementById('scene'), sg = scene.getContext('2d');
const heroCv = document.getElementById('hero'), hg = heroCv.getContext('2d');
let SW = 0, SH = 0, HW = 260, HH = 300;
function resize() {
  SW = window.innerWidth; SH = window.innerHeight;
  scene.width = SW * dpr; scene.height = SH * dpr;
  scene.style.width = SW + 'px'; scene.style.height = SH + 'px';
  sg.setTransform(dpr, 0, 0, dpr, 0, 0);
  const narrow = SW < 900;
  HW = narrow ? 210 : 260; HH = narrow ? 245 : 300;
  heroCv.width = HW * dpr; heroCv.height = HH * dpr;
  heroCv.style.width = HW + 'px'; heroCv.style.height = HH + 'px';
  hg.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildScene();                                  // 山脊/星点按新尺寸重算
}
window.addEventListener('resize', resize);

/* ================= ① 峡谷场景 ================= */
const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let ridges = [], stars = [], motes = [], bushes = [];
function buildScene() {
  const hz = SH * 0.62;                          // 地平线
  // 灌木：沿近景山脊散布，填补画面下方的空地
  bushes = Array.from({ length: 7 }, () => ({
    x: Math.random() * SW, y: hz + 60 + Math.random() * (SH - hz - 50),
    r: 12 + Math.random() * 16
  }));
  // 三层山脊：每条都是稳定的谐波曲线，只按视差整体平移，不会闪烁
  const mk = (base, amp, seed, step) => {
    const pts = [];
    for (let x = -80; x <= SW + 80; x += step)
      pts.push([x, base - amp * (0.55 * Math.sin(x * 0.0042 + seed)
        + 0.3 * Math.sin(x * 0.0113 + seed * 2.3)
        + 0.15 * Math.sin(x * 0.0231 + seed * 3.7))]);
    return { pts, base, amp };
  };
  ridges = [ mk(hz + 6,  46, 1.7, 26), mk(hz + 26, 62, 4.2, 22), mk(hz + 54, 84, 6.1, 18) ];
  stars = Array.from({ length: 70 }, () => ({
    x: Math.random() * SW, y: Math.random() * hz * 0.9,
    r: Math.random() * 1.1 + 0.3, p: Math.random() * 6.28, s: 0.6 + Math.random()
  }));
  motes = Array.from({ length: 54 }, () => ({
    x: Math.random() * SW, y: Math.random() * SH,
    r: Math.random() * 1.6 + 0.5, v: 5 + Math.random() * 14, p: Math.random() * 6.28
  }));
}
function drawScene(t, mx, my) {
  const hz = SH * 0.62;
  // 天空
  const sky = sg.createLinearGradient(0, 0, 0, SH);
  sky.addColorStop(0, '#080c14'); sky.addColorStop(0.5, '#101927'); sky.addColorStop(1, '#18263c');
  sg.fillStyle = sky; sg.fillRect(0, 0, SW, SH);
  // 地平线辉光
  const glow = sg.createRadialGradient(SW * 0.5, hz, 8, SW * 0.5, hz, SW * 0.6);
  glow.addColorStop(0, 'rgba(96,158,200,.20)'); glow.addColorStop(1, 'rgba(96,158,200,0)');
  sg.fillStyle = glow; sg.fillRect(0, 0, SW, SH);
  // 星点（闪烁）
  stars.forEach(s => {
    const a = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(t * s.s + s.p));
    sg.fillStyle = 'rgba(200,220,255,' + a.toFixed(3) + ')';
    sg.beginPath(); sg.arc(s.x, s.y, s.r, 0, 7); sg.fill();
  });
  // 三层山脊（鼠标视差）
  const cols = ['#131c2c', '#0f1624', '#0a1018'];
  const depths = [10, 20, 34];
  ridges.forEach((r, i) => {
    const dx = mx * depths[i];
    sg.fillStyle = cols[i];
    sg.beginPath(); sg.moveTo(-80, SH);
    r.pts.forEach(p => sg.lineTo(p[0] + dx, p[1]));
    sg.lineTo(SW + 80, SH); sg.closePath(); sg.fill();
  });
  // 中央河道：两条波光带
  const rw = Math.min(150, SW * 0.1), rcx = SW * 0.5 + mx * 26;
  const rg = sg.createLinearGradient(0, hz + 30, 0, SH);
  rg.addColorStop(0, '#20496e'); rg.addColorStop(1, '#14263c');
  sg.fillStyle = rg;
  sg.beginPath();
  sg.moveTo(rcx - rw * 0.55, hz + 30);
  sg.lineTo(rcx + rw * 0.55, hz + 30);
  sg.lineTo(rcx + rw, SH); sg.lineTo(rcx - rw, SH);
  sg.closePath(); sg.fill();
  sg.strokeStyle = 'rgba(150,205,255,.16)'; sg.lineWidth = 2; sg.lineCap = 'round';
  for (let i = 0; i < 5; i++) {
    const y = hz + 40 + ((t * 26 + i * 46) % (SH - hz));
    const k = (y - hz) / (SH - hz), w = rw * (0.5 + k);
    sg.beginPath();
    sg.moveTo(rcx - w + Math.sin(t * 2 + i) * 6, y);
    sg.lineTo(rcx + w + Math.sin(t * 2 + i) * 6, y);
    sg.stroke();
  }
  // 车道分隔线：两条平行于河道边缘的长线 + 等距横向刻度（像游戏里的兵线）
  sg.strokeStyle = 'rgba(170,215,255,.13)'; sg.lineWidth = 1.5;
  [0.28, 0.72].forEach(f => {
    sg.beginPath();
    sg.moveTo(rcx - rw * (1 - f), hz + 30);
    sg.lineTo(rcx - rw * (2 * f), SH);
    sg.stroke();
    sg.beginPath();
    sg.moveTo(rcx + rw * (1 - f), hz + 30);
    sg.lineTo(rcx + rw * (2 * f), SH);
    sg.stroke();
  });
  sg.strokeStyle = 'rgba(170,215,255,.10)'; sg.lineWidth = 2;
  for (let y = hz + 56; y < SH; y += 54) {
    const k = (y - hz) / (SH - hz), w = rw * (0.5 + k) * 0.82;
    sg.beginPath(); sg.moveTo(rcx - w, y); sg.lineTo(rcx + w, y); sg.stroke();
  }
  // 地图装饰：外侧防御塔 + 灌木（填补左右下方的空地）
  const tower = (x, y, sc) => {
    sg.fillStyle = '#0c1320';
    sg.fillRect(x - 9 * sc, y - 34 * sc, 18 * sc, 34 * sc);
    sg.fillRect(x - 13 * sc, y - 41 * sc, 26 * sc, 8 * sc);
    sg.fillRect(x - 4 * sc, y - 51 * sc, 8 * sc, 11 * sc);
  };
  tower(SW * 0.07, hz + 92, 1.15);
  tower(SW * 0.93, hz + 92, 1.15);
  sg.fillStyle = '#10241a';
  bushes.forEach(b => {
    sg.beginPath(); sg.ellipse(b.x, b.y, b.r, b.r * 0.5, 0, 0, 7); sg.fill();
  });
  // 双方水晶 + 防御塔剪影
  const crystal = (x, col) => {
    const pulse = 0.6 + 0.4 * Math.sin(t * 1.6 + x);
    const y = hz + 34;
    const cg = sg.createRadialGradient(x, y, 2, x, y, 70);
    cg.addColorStop(0, col.replace('1)', (0.5 * pulse + 0.2).toFixed(2) + ')'));
    cg.addColorStop(1, col.replace('1)', '0)'));
    sg.fillStyle = cg;
    sg.beginPath(); sg.arc(x, y, 70, 0, 7); sg.fill();
    sg.fillStyle = col.replace('1)', '0.9)');
    sg.beginPath();
    sg.moveTo(x, y - 16); sg.lineTo(x + 9, y); sg.lineTo(x, y + 16); sg.lineTo(x - 9, y);
    sg.closePath(); sg.fill();
    // 塔剪影
    sg.fillStyle = '#0d141f';
    sg.fillRect(x + (x < SW / 2 ? 34 : -50), y - 26, 16, 26);
    sg.fillRect(x + (x < SW / 2 ? 30 : -54), y - 32, 24, 7);
  };
  crystal(SW * 0.16 + mx * 14, 'rgba(63,140,255,1)');
  crystal(SW * 0.84 + mx * 14, 'rgba(255,82,82,1)');
  // 上浮光尘
  motes.forEach(m => {
    const y = reduced ? m.y : (m.y - t * m.v) % SH;
    const yy = y < 0 ? y + SH : y;
    const a = 0.12 + 0.3 * (0.5 + 0.5 * Math.sin(t * 1.4 + m.p));
    sg.fillStyle = 'rgba(180,220,255,' + a.toFixed(3) + ')';
    sg.beginPath(); sg.arc(m.x + Math.sin(t * 0.6 + m.p) * 8, yy, m.r, 0, 7); sg.fill();
  });
  // 暗角
  const vg = sg.createRadialGradient(SW / 2, SH * 0.45, SH * 0.3, SW / 2, SH * 0.5, SW * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.62)');
  sg.fillStyle = vg; sg.fillRect(0, 0, SW, SH);
}

/* ================= ③ 英雄展示台 ================= */
const ORDER = ['marksman', 'assassin', 'tank', 'support'];
const NAMES = { marksman: ['射手', 'Marksman'], assassin: ['刺客', 'Assassin'],
  tank: ['肉盾', 'Tank'], support: ['辅助', 'Support'] };
const mocks = {};
ORDER.forEach(r => {
  mocks[r] = { role: r, team: 0, vx: 60, vy: 0, vaim: -0.35, aim: -0.35,
    walkPhase: Math.random() * 6, atkCdT: 0, skillAnimT: 0, stealthT: 0, shield: 0,
    speedT: 0, sprintT: 0, slowT: 0, isPlayer: false, lastCombat: -99, bowRaise: 0,
    lvl: 5, hp: 1, maxHp: 1, dead: false };
});
const model = (role, c, alpha, g) => {
  if (role === 'marksman') drawMarksmanModel(c, alpha, g);
  else if (role === 'assassin') drawAssassinModel(c, alpha, g);
  else if (role === 'tank') drawTankModel(c, alpha, g);
  else drawSupportModel(c, alpha, g);
};
let cur = 0, prev = 0, fade = 1, hold = 0, atkT = 2.4;
function heroStep(dt) {
  const role = ORDER[cur], m = mocks[role], rd = ROLES[role];
  m.walkPhase += dt * 2.3;
  atkT -= dt;
  if (atkT <= 0) { atkT = 3.6 + Math.random() * 3; m.atkCdT = rd.atkCd; }
  // 攻击动画只播 0.6→1.0 段（ap<0.4 才是挥击/放箭），播完停在待机
  if (m.atkCdT > rd.atkCd * 0.6) m.atkCdT = Math.max(rd.atkCd * 0.6, m.atkCdT - dt * rd.atkCd * 1.7);
  if (fade < 1) { fade = Math.min(1, fade + dt / 0.55); if (fade >= 1) prev = cur; }
  else if (hold > 4.2) { prev = cur; cur = (cur + 1) % ORDER.length; fade = 0; hold = 0; updateLabel(); }
  hold += dt;
}
function updateLabel() {
  const r = ORDER[cur];
  document.getElementById('heroCn').textContent = NAMES[r][0];
  document.getElementById('heroEn').textContent = NAMES[r][1];
  document.querySelectorAll('#dots i').forEach((d, i) => d.classList.toggle('on', i === cur));
}
function drawHero() {
  hg.clearRect(0, 0, HW, HH);
  // 底座光晕（跟着脚底位置）
  const gr = hg.createRadialGradient(HW / 2, HH - 30, 4, HW / 2, HH - 30, HW * 0.55);
  gr.addColorStop(0, 'rgba(76,175,80,.20)'); gr.addColorStop(1, 'rgba(76,175,80,0)');
  hg.fillStyle = gr; hg.fillRect(0, 0, HW, HH);
  hg.save();
  hg.translate(HW / 2, HH - 30);
  const SC = (HH - 58) / 48;                      // 按最高的肉盾（约 48 本地单位）留边距，并给脚下队伍环留空间
  hg.scale(SC, SC);
  hg.lineCap = 'round'; hg.lineJoin = 'round';
  if (fade < 1 && prev !== cur) model(ORDER[prev], mocks[ORDER[prev]], (1 - fade) * 0.85, hg);
  model(ORDER[cur], mocks[ORDER[cur]], fade < 1 ? 0.15 + fade * 0.85 : 1, hg);
  hg.restore();
}

/* ================= 主循环 ================= */
let last = performance.now(), tSec = 0;
const mouse = { x: 0.5, y: 0.5 };
window.addEventListener('mousemove', e => { mouse.x = e.clientX / SW; mouse.y = e.clientY / SH; });
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  tSec += dt;
  gameTime += dt;                                 // 推进模型动画时钟（声明在 heroes.js）
  heroStep(dt);
  drawScene(tSec, (mouse.x - 0.5) * 2, (mouse.y - 0.5) * 2);
  drawHero();
  requestAnimationFrame(frame);
}
resize(); updateLabel(); requestAnimationFrame(frame);
</script>
</body>
</html>
